spring:
  application:
    name: erp-almacen-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: ${APP_TIME_ZONE:America/Lima}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
  issuer: ${JWT_ISSUER:erp-almacen-backend}

app:
  time-zone: ${APP_TIME_ZONE:America/Lima}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
